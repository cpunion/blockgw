name: Soak

# Long runs that do not fit in every pull request: a soak test watching for slow leaks and an
# unbounded store, and longer torture runs. Daily, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: soak duration in minutes
        default: "45"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  long:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: soak, slug: soak, cmd: "tests/soak/soak.py --minutes MINUTES --work /tmp/blockgw-long" }
          - { name: "torture, 4 writers (20 min)", slug: torture, cmd: "tests/torture/torture.py --policy remote --threads 4 --seconds 1200 --work /tmp/blockgw-long" }
          - { name: "XFS torture (20 min)", slug: fstorture, cmd: "tests/torture/fstorture.py --policy remote --seconds 1200 --work /tmp/blockgw-long" }
          - { name: "takeover torture (20 min)", slug: fencetorture, cmd: "tests/torture/fencetorture.py --policy remote --seconds 1200 --work /tmp/blockgw-long" }
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies and load ublk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev xfsprogs "linux-modules-extra-$(uname -r)"
          sudo modprobe ublk_drv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Run
        run: |
          cmd="${{ matrix.cmd }}"
          cmd="${cmd/MINUTES/${{ github.event.inputs.minutes || '45' }}}"
          sudo python3 $cmd --blockgw target/release/blockgw --seed ${{ github.run_id }}
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ matrix.slug }}
          path: |
            /tmp/blockgw-long/**/*.log
            /tmp/blockgw-long/**/samples.json
